<text x="216" y="335" fill="#142c45" font-size="23" font-weight="700">売上原価</text>
<text x="216" y="363" fill="#125650" font-size="19" font-weight="700">売上高と対応させる</text>
<text x="216" y="390" fill="#263949" font-size="17">売上高 − 売上原価 ＝ 売上総利益</text>
</g>
</svg>
