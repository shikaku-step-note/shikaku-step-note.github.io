<text x="216" y="335" fill="#142c45" font-size="23" font-weight="700">原因を確認</text>
<text x="216" y="363" fill="#125650" font-size="19" font-weight="700">誰が決めた条件かを調べる</text>
<text x="216" y="390" fill="#263949" font-size="17">現場の使用量、本部の契約・配賦基準</text>
</g>
