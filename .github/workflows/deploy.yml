name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:storage
      - run: node --test tests/indexnow.test.mjs
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shikaku-step-note.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      - run: pnpm verify
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shikaku-step-note.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      - name: Build IndexNow URL manifest
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shikaku-step-note.github.io' }}
        run: node scripts/indexnow.mjs manifest dist manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-current
          path: manifest.json
          overwrite: true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-current
          path: indexnow-current
      - name: Restore last accepted URL manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=indexnow-accepted&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | max_by(.id) | .workflow_run.id // empty')
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name indexnow-accepted --dir indexnow-previous
          fi
      - name: Notify IndexNow of published changes
        run: node scripts/indexnow.mjs submit indexnow-current/manifest.json indexnow-previous/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-accepted
          path: indexnow-current/manifest.json
          overwrite: true
